# Seed Specification v2
# Generated: 2026-09-13
# Source Interview: .harness/ouroboros/interviews/2026-09-13-01-56.yaml
# WARNING: This file is immutable. To change, create a new version.
#
# 이 시드는 seed-v1(건강 도메인 프로토타입)의 브라운필드 확장이다 — 3개 시드
# 로드맵(OAuth → 결제 → 어드민)의 첫 번째. seed-v1의 User/AgentPersona 온톨로지와
# 3-tier 아키텍처를 그대로 이어받는다.

version: 2
created: "2026-09-13T01:56:56"
interview_ref: ".harness/ouroboros/interviews/2026-09-13-01-56.yaml"
extends: "seed-v1.yaml"

goal:
  summary: "기존 이메일/비밀번호 로그인을 그대로 유지한 채 구글 OAuth를 두 번째 로그인 옵션으로 추가하고, 세션 관리를 Supabase 표준(@supabase/ssr) 방식으로 전환한다."
  detail: >
    특정 문제(가입 마찰, 비밀번호 분실 부담)를 해결하려는 목적이 아니라 로그인
    방식의 선택지를 넓히는 것 자체가 목적이다. 구글로 처음 로그인한 사용자는
    seed-v1의 회원가입이 요구하던 생년월일(AgentPersona 매칭용)을 받을 타이밍이
    없으므로, 로그인 직후 1회 온보딩 화면을 거친다. 동일 이메일의 기존
    이메일/비밀번호 계정이 있으면 자동으로 연결한다.
  non_goals:
    - "이메일/비밀번호 로그인 제거 또는 구글 전용으로의 강제 전환"
    - "카카오/네이버 등 구글 외 다른 소셜 로그인 제공자 추가 (seed-v1 non_goals 재확인)"
    - "결제/구독 기능 (seed-v3에서 다룸)"
    - "관리자 대시보드 (seed-v4에서 다룸)"
    - "여러 OAuth/이메일 계정을 사용자가 직접 연결·해제하는 계정 관리 UI"
    - "구글 동의화면 자체를 포함한 완전 자동 E2E (콜백 이후만 자동화, 동의화면은 수동 검증)"

constraints:
  must:
    - "기존 이메일/비밀번호 로그인 화면과 흐름은 변경 없이 그대로 동작한다"
    - "세션 관리를 @supabase/ssr 표준 방식으로 전환한다 — 기존 커스텀 쿠키(AUTH_COOKIE_NAME, src/proxy.ts의 수동 쿠키 체크, src/app/_lib/session.ts)를 걷어내고 교체한다"
    - "동일 이메일의 기존 계정이 있고 구글 쪽 이메일이 verified인 경우에만 자동으로 계정을 연결한다"
    - "구글로 신규가입한 사용자는 로그인 직후 온보딩 화면에서 생년월일을 1회 입력받아 AgentPersona를 매칭한다 (seed-v1 AC-002 유지)"
    - "생년월일 입력 전까지는 AgentPersona가 없는 상태로 앱을 정상 사용할 수 있어야 한다 (세션 자체는 막지 않음)"
    - "3-tier(Presentation/Logic/Data) 레이어 분리를 유지한다 (seed-v1과 동일 원칙, ARCHITECTURE_INVARIANTS.md 그대로 적용)"
    - "OAuth 콜백 처리, 세션 교환, 계정 자동연결, 온보딩 로직은 자동화된 테스트(유닛/통합/E2E)로 검증한다"
  must_not:
    - "이메일 미검증(unverified) 구글 이메일을 기존 계정에 자동 연결하지 않는다"
    - "Google OAuth Client ID/Secret 등 자격증명을 코드나 커밋에 노출하지 않는다 (환경변수로만 관리, seed-v1 must_not 재확인)"
    - ".env 등 시크릿 파일을 커밋하지 않는다 (seed-v1 must_not 재확인)"
  should:
    - "약 이틀 스코프로 완성 가능한 범위로 제한한다"
    - "Google Cloud Console에서 OAuth 클라이언트를 발급하는 절차를 문서화해, 사용자가 직접 자격증명을 발급하도록 안내한다 (에이전트가 대신 발급할 수 없는 외부 계정 작업)"

acceptance_criteria:
  - id: "AC-001"
    description: "방문자는 로그인 페이지의 '구글로 계속하기' 버튼으로 구글 OAuth 인증을 거쳐 로그인하거나 신규가입할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "high"
  - id: "AC-002"
    description: "기존 이메일/비밀번호 회원가입·로그인은 seed-v1과 동일하게 회귀 없이 계속 동작한다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-003"
    description: "동일 이메일의 기존 계정이 있는 상태에서 구글로 로그인하면, 구글 이메일이 verified인 경우 자동으로 같은 계정에 연결되어 로그인된다; verified가 아니면 연결이 거부되고 사용자에게 안내 메시지가 표시된다"
    verification: "automated"
    priority: "must"
    complexity: "high"
  - id: "AC-004"
    description: "구글로 처음 로그인한 신규 사용자는 온보딩 화면에서 생년월일을 입력해야 하며, 입력 전까지는 AgentPersona 없이(빈 상태 UX로) 앱을 사용할 수 있고, 입력 직후 AgentPersona가 매칭된다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-005"
    description: "로그인 세션 확인(현재 사용자 조회, 보호된 라우트 접근 제어)은 @supabase/ssr 표준 방식으로 이뤄지며, 기존 커스텀 AUTH_COOKIE_NAME 쿠키 로직은 더 이상 존재하지 않는다"
    verification: "automated"
    priority: "must"
    complexity: "high"
  - id: "AC-006"
    description: "로그아웃은 이메일 로그인 사용자와 구글 로그인 사용자 모두에게 동일하게 동작하며, 세션이 완전히 무효화되어 보호된 라우트가 다시 로그인 화면으로 리다이렉트된다"
    verification: "automated"
    priority: "must"
    complexity: "low"
  - id: "AC-007"
    description: "구글 OAuth 인증이 실패하거나 사용자가 동의를 취소하면, 앱이 오류로 중단되지 않고 안내 메시지와 함께 로그인 페이지로 돌아온다 (seed-v1 AC-010 예외처리 원칙 재사용)"
    verification: "manual"
    priority: "must"
    complexity: "medium"

ontology:
  entities:
    - name: "User"
      note: "seed-v1 User의 확장. birth_date가 optional로 바뀐다 — 구글 신규가입 시점엔 값이 없다가 온보딩 완료 후 채워진다. password_hash는 기존과 동일하게 Supabase Auth(auth.users)가 관리하며 public.users에는 존재하지 않는다."
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "email"
          type: "string"
          required: true
        - name: "name"
          type: "string"
          required: true
        - name: "birth_date"
          type: "date"
          required: false
        - name: "agent_persona_id"
          type: "reference"
          required: false
      relationships:
        - target: "HealthLog"
          type: "has_many"
        - target: "CareLink"
          type: "has_many"
        - target: "Conversation"
          type: "has_many"
        - target: "AgentPersona"
          type: "belongs_to"
  actions:
    - name: "SignInWithGoogle"
      actor: "방문자 또는 기존 User"
      input: "구글 OAuth 인가 코드(콜백 리다이렉트를 통해 수신)"
      output: "세션 + User (신규 생성되었거나, 동일 이메일 기존 계정에 연결됨)"
      side_effects:
        - "신규 사용자면 public.users 행을 birth_date 없이 생성"
        - "동일 이메일의 verified 기존 계정이 있으면 자동 연결, 아니면 연결 거부"
        - "@supabase/ssr 표준 세션 쿠키 발급"
    - name: "CompleteOnboarding"
      actor: "AgentPersona가 아직 매칭되지 않은 User (주로 구글 신규가입자)"
      input: "birth_date"
      output: "User.birth_date 갱신 + AgentPersona 매칭 결과"
      side_effects:
        - "User.agent_persona_id 갱신 (seed-v1 AC-002의 연령대 매핑 로직 재사용)"
    - name: "Logout"
      actor: "로그인한 User (이메일/구글 무관)"
      input: "없음"
      output: "세션 무효화"
      side_effects:
        - "@supabase/ssr 세션 쿠키 제거"

invariants:
  - "구글 이메일이 verified가 아니면 어떤 기존 계정과도 자동으로 연결되지 않는다"
  - "AgentPersona가 없는 User도 세션은 유효하며 앱 접근 자체는 막히지 않는다 — 막히는 것은 연령대별 AI 코치 개인화뿐이다"
  - "이메일/비밀번호 로그인 경로는 이 시드의 어떤 변경으로도 깨지지 않는다 (seed-v1 AC-001 회귀 금지)"
  - "Google OAuth Client Secret은 서버 환경변수로만 존재하며 클라이언트 번들에 포함되지 않는다"

architecture:
  pattern: "3-tier-layered"
  layers:
    presentation:
      description: "로그인 페이지의 구글 버튼, OAuth 콜백 Route Handler, 온보딩 페이지, @supabase/ssr 기반 미들웨어"
      directories: ["src/app", "src/components"]
      responsibilities:
        - "구글 로그인 버튼 및 리다이렉트 트리거"
        - "콜백에서 code-for-session 교환 요청"
        - "온보딩 폼 UI"
      cannot_access: ["database", "external_services"]
    logic:
      description: "계정 자동연결 판정, verified 여부 검증, 온보딩 완료 처리 — seed-v1의 auth-service/agent-persona-service 재사용·확장"
      directories: ["src/app/api", "src/services"]
      responsibilities:
        - "구글 이메일 verified 여부에 따른 계정 연결/거부 판정"
        - "온보딩 시 AgentPersona 매칭 (seed-v1 로직 재사용)"
      cannot_access: []
    data:
      description: "Supabase Auth(@supabase/ssr 클라이언트), public.users 갱신"
      directories: ["src/lib/data", "src/lib/llm"]
      responsibilities:
        - "@supabase/ssr 서버/브라우저 클라이언트 제공"
        - "OAuth 로그인으로 생성된 auth.users에 대응하는 public.users 행 생성/조회"
      cannot_access: ["presentation"]
  layer_communication:
    presentation_to_logic: "Server Action 직접 호출 또는 Route Handler(OAuth 콜백)"
    logic_to_data: "repository/client wrapper 패턴 (seed-v1과 동일)"
    data_format: "DTO/plain object"

scope:
  mvp:
    - "로그인 페이지 '구글로 계속하기' 버튼 + OAuth 콜백 처리"
    - "동일 이메일 자동 계정 연결 (verified 조건부)"
    - "생년월일 온보딩 플로우 (AgentPersona 매칭)"
    - "@supabase/ssr 전환 — 미들웨어, 서버/브라우저 클라이언트, 기존 커스텀 쿠키 로직 제거"
    - "이메일/구글 공통 로그아웃"
  future:
    - "카카오/네이버 등 추가 소셜 로그인 제공자"
    - "사용자가 직접 연결된 계정(이메일/구글)을 관리·해제하는 UI"
    - "구글 동의화면까지 포함하는 완전 자동 E2E (테스트용 구글 계정 인프라 구축 시)"

tech_decisions:
  - decision: "세션 관리를 커스텀 쿠키에서 @supabase/ssr 표준 방식으로 전환한다"
    reason: "OAuth 리다이렉트 흐름과 자연스럽게 맞고, Supabase 공식 권장 방식이라 유지보수 비용이 낮다. 사용자가 명시적으로 전환에 동의했다"
    alternatives_considered:
      - "기존 커스텀 쿠키 모델을 유지하고 OAuth 콜백만 수동으로 얹기 (기각 — 두 세션 모델이 공존하면 구현/디버깅 복잡도가 더 커진다고 판단)"
  - decision: "계정 자동 연결은 구글 이메일이 verified인 경우로 제한한다"
    reason: "보안(미검증 이메일을 통한 계정 탈취 방지)과 사용자가 선택한 '자동 연결(추천)' UX를 동시에 만족"
    alternatives_considered:
      - "조건 없이 무조건 자동 연결 (기각 — 계정 탈취 위험)"
      - "자동 연결 없이 항상 에러 화면으로 사용자에게 직접 처리를 맡김 (기각 — 사용자가 자동 연결을 선택함)"
  - decision: "생년월일 수집을 로그인 직후 별도 1회성 온보딩 화면으로 분리한다"
    reason: "Google OAuth 흐름은 임의의 추가 필드를 함께 받을 수 없어 구조적으로 별도 스텝이 필요하다"
    alternatives_considered:
      - "없음 — 구조적으로 다른 대안이 없음"
