# Seed Specification v4
# Generated: 2026-09-17
# Source Interview: .harness/ouroboros/interviews/2026-09-17-18-07.yaml
# WARNING: This file is immutable. To change, create a new version.

version: 4
created: "2026-09-17T18:20:00"
interview_ref: ".harness/ouroboros/interviews/2026-09-17-18-07.yaml"
extends: "seed-v3.yaml"

goal:
  summary: "단일 운영자를 위한 관리자 대시보드(/admin)를 만들어 매출/구독 현황을 보고, 결제는 성공했지만 DB 반영에 실패해 방치된 구독을 안전하게 복구할 수 있게 한다."
  detail: >
    seed-v1(인증)~seed-v3(결제)가 계속 미뤄온 "관리자용 결제/매출 조회, 구독
    강제 조작"을 다룬다. 관리자는 서비스를 실제로 운영하는 본인 1명뿐이며,
    새 권한 체계 없이 기존 로그인 + 환경변수 이메일 비교로 접근을 제한한다.
    핵심은 "임의로 무엇이든 바꿀 수 있는 관리 도구"가 아니라, seed-v3에서
    발견된 실제 위험(partial_failure로 방치된 구독, 이론상 가능한 중복 유효
    구독)을 안전하게 들여다보고, 그중 되돌려도 안전한 경우(실제 결제가
    성공한 경우)만 복구할 수 있는 좁은 도구다.
  non_goals:
    - "역할/권한 세분화 (관리자가 여러 명이거나 등급이 나뉘는 경우)"
    - "실제 환불 실행(토스페이먼츠 환불 API 호출)"
    - "결제수단(카드) 직접 수정/삭제 — billing_key 조회 없음"
    - "유저 계정 삭제/정지"
    - "실시간 갱신(자동 새로고침, 라이브 데이터, WebSocket)"
    - "차트/그래프 시각화 — 숫자와 테이블만"
    - "케어링크/헬스로그 개별 유저 드릴다운 (전체 집계 수치만)"
    - "임의 상태로의 자유로운 구독 상태 전환 — '결제 성공 확인된 건만 active로 복구'라는 단 하나의 정해진 구제 동작만 허용"
    - "중복 유효 구독(이상 상태) 자동 교정 — 탐지/조회만 하고 고치지 않는다"
    - "관리자 조회 행위 자체의 감사 로깅 — 로그는 유일한 쓰기 액션(구독 복구)에만 남는다"

constraints:
  must:
    - "/admin 하위 모든 페이지·API는 로그인 세션이 있고 그 User.email이 환경변수 ADMIN_EMAIL과 정확히 일치할 때만 접근을 허용한다 — 그 외(로그인 안 함, 다른 유저로 로그인)는 전부 차단한다"
    - "결제 성공/실패 판정 없이 방치된 구독(status IN trial,active AND next_billing_at IS NULL AND current_period_end < 오늘)을 발견하면, 그 subscription의 가장 최근 PaymentAttempt.result로 recoverable(A, 최근 결과=success) / not_recoverable(B, 최근 결과=failure) / undetermined(해당 시점 PaymentAttempt 자체가 없음)로 반드시 3분류한다"
    - "RecoverPartialFailure(구독 복구)는 서버 측에서 대상 subscription이 recoverable(A)로 재판정될 때만 실행된다 — 클라이언트가 recoverable이라고 주장해도 서버가 다시 검증하지 않으면 거부한다"
    - "RecoverPartialFailure가 성공하면 Subscription.status=active로 전환하는 동시에 current_period_start/current_period_end/next_billing_at을 정상적인 한 주기 값으로 재계산해 채운다 — status만 바꾸고 next_billing_at을 null로 방치하지 않는다(다음 cron이 정상적으로 이 구독을 다시 청구 대상으로 잡을 수 있어야 한다)"
    - "RecoverPartialFailure가 실행될 때마다 AdminActionLog에 관리자(User.id)·대상 subscription_id·previous_status·new_status·시각을 기록한다 — Subscription 갱신과 AdminActionLog 생성 중 하나만 성공하는 상태를 만들지 않는다(둘 다 성공하거나, 사용자에게 실패로 보고하고 Subscription도 원상태로 남긴다)"
    - "DetectDuplicateActiveSubscriptions는 한 User가 동시에 유효한(status IN trial,active,past_due) Subscription을 2건 이상 가진 경우를 찾아 목록으로만 보여준다 — 자동으로 정리/병합하지 않는다"
    - "매출 합계는 PaymentAttempt.result='success'인 건의 amount만 집계한다 — 실패/취소 시도는 매출에 포함하지 않는다"
    - "결제수단(PaymentMethod)의 billing_key, 카드 원본 정보는 관리자 화면에서도 절대 노출하지 않는다 — seed-v3의 '카드 원본 정보 미저장/미노출' 원칙을 관리자 UI에도 동일하게 적용한다"
  must_not:
    - "관리자가 구독 상태를 recoverable(A) 판정 없이 임의로(예: past_due에서 바로, 또는 판정 없이 즉시) active로 바꿀 수 있게 하지 않는다"
    - "실제 토스페이먼츠 환불/청구 API를 호출하지 않는다 — 이 시드의 모든 쓰기 액션은 우리 DB 상태 전환(status/기간 재계산)과 AdminActionLog 기록뿐이다"
    - "AdminActionLog 레코드를 수정하거나 삭제하는 기능을 만들지 않는다 (append-only)"
    - "User 엔티티에 role/is_admin 같은 새 필드를 추가하지 않는다 — 관리자 판정은 런타임에 email과 ADMIN_EMAIL을 비교하는 것으로 충분하다"
    - "ADMIN_EMAIL 값을 클라이언트 번들이나 로그에 노출하지 않는다"
  should:
    - "매출/구독자 현황 조회는 기간(월별 등) 필터를 지원해 특정 달의 매출을 바로 확인할 수 있게 한다"
    - "구독자 목록은 이메일/이름으로 검색 가능해야 한다"

acceptance_criteria:
  - id: "AC-001"
    description: "관리자가 /admin에 접속하면 현재 구독자 수를 상태별(trial/active/past_due/canceled/expired)로 보고, 기간을 지정해 그 기간의 매출 합계(PaymentAttempt.result=success인 amount 합)를 숫자/테이블로 확인할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "medium"
  - id: "AC-002"
    description: "관리자는 전체 구독자 목록을 이메일/이름으로 검색하고 구독 상태로 필터링해 조회할 수 있다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-003"
    description: "관리자가 특정 구독자를 선택하면 그 유저의 Subscription 이력과 각 Subscription에 딸린 PaymentAttempt(결제 시도) 전체 이력을 확인할 수 있다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-004"
    description: "관리자는 서비스 전체 집계 수치(총 가입자 수, 총 HealthLog 기록 수, 활성 CareLink 수)를 한 화면에서 확인할 수 있다"
    verification: "automated"
    priority: "must"
    complexity: "low"
  - id: "AC-005"
    description: "관리자는 partial_failure로 방치된 것으로 추정되는 구독 목록을 확인할 수 있고, 각 건이 recoverable(실제 결제 성공 확인됨)/not_recoverable(결제 실패 확인됨)/undetermined(판단 불가) 중 무엇인지 구분해서 표시된다 — recoverable 건에만 복구 조작이 가능하다는 게 화면에 드러난다"
    verification: "automated"
    priority: "must"
    complexity: "high"
  - id: "AC-006"
    description: "관리자가 recoverable로 표시된 구독에 대해 복구를 실행하면, 서버가 다시 한번 recoverable 여부를 재검증한 뒤 Subscription을 status=active와 정상적인 다음 결제 주기(current_period/next_billing_at)로 갱신하고 AdminActionLog에 이 조작을 기록한다. not_recoverable이나 undetermined 건에 대해 복구를 시도하면(직접 API 호출 등 UI 우회 포함) 서버가 거부한다"
    verification: "both"
    priority: "must"
    complexity: "high"
  - id: "AC-007"
    description: "관리자는 동시에 유효한(trial/active/past_due) Subscription을 2건 이상 가진 User 목록을 조회할 수 있다 (수정 기능 없음, 발견용)"
    verification: "automated"
    priority: "must"
    complexity: "low"
  - id: "AC-008"
    description: "로그인하지 않았거나, 로그인했지만 User.email이 환경변수 ADMIN_EMAIL과 다른 유저가 /admin 이하 페이지나 그 API를 직접 호출하면 전부 차단된다(페이지는 리다이렉트, API는 403)"
    verification: "automated"
    priority: "must"
    complexity: "medium"

ontology:
  entities:
    - name: "AdminActionLog"
      note: >
        이번 시드의 유일한 신규 엔티티. 관리자의 유일한 쓰기 액션(RecoverPartialFailure)에
        대해서만 생성되는 append-only 감사 기록이다. 조회 액션(ViewRevenueSummary,
        ListSubscribers, ViewSubscriberPaymentHistory, ViewServiceStats,
        DetectPartialFailures, DetectDuplicateActiveSubscriptions)은 이 엔티티를
        생성하지 않는다 — 로깅 대상은 "돈이 걸린 상태 변경" 하나뿐이다.
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "admin_user_id"
          type: "reference"
          required: true
        - name: "subscription_id"
          type: "reference"
          required: true
        - name: "action_type"
          type: "string"
          enum: ["recover_partial_failure"]
          required: true
        - name: "previous_status"
          type: "string"
          enum: ["trial", "active", "canceled", "past_due", "expired"]
          required: true
        - name: "new_status"
          type: "string"
          enum: ["trial", "active", "canceled", "past_due", "expired"]
          required: true
        - name: "performed_at"
          type: "date"
          required: true
      relationships:
        - target: "User"
          type: "belongs_to"
        - target: "Subscription"
          type: "belongs_to"
    - name: "User"
      note: >
        seed-v1 정의를 그대로 재사용한다 — 필드를 추가하지 않는다. "관리자"는
        User의 새 필드나 새 타입이 아니라, User.email == 환경변수 ADMIN_EMAIL이라는
        런타임 조건을 만족하는 User를 가리키는 서술일 뿐이다(must_not 참고).
      fields: []
      relationships:
        - target: "AdminActionLog"
          type: "has_many"
    - name: "Subscription"
      note: "seed-v3 정의를 그대로 재사용한다 — 필드를 추가하지 않는다."
      fields: []
      relationships:
        - target: "AdminActionLog"
          type: "has_many"

  actions:
    - name: "ViewRevenueSummary"
      actor: "관리자(User.email = ADMIN_EMAIL)"
      input: "기간(start_date, end_date), 선택적"
      output: "상태별 구독자 수 분포, 기간 내 매출 합계(PaymentAttempt.result=success인 amount 합)"
      side_effects:
        - "없음 (읽기 전용)"
    - name: "ListSubscribers"
      actor: "관리자"
      input: "검색어(email/name), 상태 필터, 페이지네이션"
      output: "User + 각자의 최신 Subscription 상태 목록"
      side_effects:
        - "없음 (읽기 전용)"
    - name: "ViewSubscriberPaymentHistory"
      actor: "관리자"
      input: "user_id"
      output: "해당 유저의 Subscription 이력 + 각 Subscription에 딸린 PaymentAttempt 전체"
      side_effects:
        - "없음 (읽기 전용)"
    - name: "ViewServiceStats"
      actor: "관리자"
      input: "없음"
      output: "총 가입자 수, 총 HealthLog 수, 활성 CareLink 수"
      side_effects:
        - "없음 (읽기 전용)"
    - name: "DetectPartialFailures"
      actor: "관리자"
      input: "없음"
      output: "방치 의심 Subscription 목록, 각각 recoverable(A)/not_recoverable(B)/undetermined 3분류 태그"
      side_effects:
        - "없음 (읽기 전용) — 판정은 영속화된 값을 읽는 게 아니라 Subscription(status, next_billing_at, current_period_end)과 해당 subscription의 가장 최근 PaymentAttempt.result를 사후 재해석해 계산한다"
    - name: "DetectDuplicateActiveSubscriptions"
      actor: "관리자"
      input: "없음"
      output: "동시에 유효한(trial/active/past_due) Subscription을 2건 이상 가진 User와 그 Subscription 목록"
      side_effects:
        - "없음 (읽기 전용)"
    - name: "RecoverPartialFailure"
      actor: "관리자"
      input: "subscription_id"
      output: "성공 시 Subscription(status=active, current_period/next_billing_at 재계산됨) — 서버 재판정 결과 recoverable이 아니면 상태 변경 없이 거부"
      side_effects:
        - "서버가 DetectPartialFailures와 동일한 판정 로직을 재실행해 recoverable 여부를 재검증한다(클라이언트 판정을 신뢰하지 않는다)"
        - "Subscription.status=active로 전환, current_period_start=now, current_period_end/next_billing_at을 plan 기준 한 주기 뒤로 재계산"
        - "AdminActionLog 레코드 생성(admin_user_id, subscription_id, action_type=recover_partial_failure, previous_status, new_status=active, performed_at)"
        - "Subscription 갱신과 AdminActionLog 생성은 둘 다 성공하거나 둘 다 반영되지 않아야 한다(must 제약 참고) — 한쪽만 성공하는 상태를 만들지 않는다"

  invariants:
    - "관리자 판정은 User.email과 환경변수 ADMIN_EMAIL의 런타임 비교로만 이루어진다 — User 엔티티에 role/is_admin 필드를 추가하지 않는다"
    - "AdminActionLog는 RecoverPartialFailure(현재 유일한 쓰기 액션)에 대해서만 생성된다 — 읽기 전용 액션은 감사 로그를 남기지 않는다"
    - "AdminActionLog는 append-only다 — 생성된 레코드를 수정·삭제하는 액션은 존재하지 않는다"
    - "RecoverPartialFailure는 서버 측 재판정에서 recoverable로 확인된 Subscription에만 허용된다 — UI에서 버튼을 숨기는 것은 방어가 아니다"
    - "recoverable/not_recoverable/undetermined 판정은 영속화된 BillingOutcome 값이 아니라 Subscription과 해당 subscription의 가장 최근 PaymentAttempt.result를 매 조회 시점마다 재계산한 결과다"
    - "DetectDuplicateActiveSubscriptions는 seed-v3 invariant(한 User는 동시에 유효한 Subscription을 최대 1건만 갖는다)의 위반 사례를 관측만 할 뿐 교정하지 않는다"

architecture:
  pattern: "3-tier-layered"
  layers:
    presentation:
      description: "/admin 이하 페이지(대시보드 요약, 구독자 목록/상세, 이상 상태 탐지 화면)와 그 화면이 호출하는 Server Action/Route Handler. 접근 게이트(ADMIN_EMAIL 확인)를 담당한다."
      directories: ["src/app/admin", "src/components"]
      responsibilities:
        - "관리자 접근 게이트 — 세션 없음/이메일 불일치 시 리다이렉트(페이지) 또는 403(API)"
        - "매출/구독자 현황, 서비스 통계, 이상 상태(partial_failure/중복 구독) 목록 렌더링"
        - "recoverable 건에 한해 복구 버튼 노출 및 Server Action 트리거"
      cannot_access: ["database", "external_services"]
    logic:
      description: "관리자 조회/집계와 partial_failure 판정, 구독 복구 오케스트레이션 — src/services에 admin-service로 신설. seed-v3의 subscription-service/billing-service를 참조하되 그 파일을 직접 수정하지 않고 새 서비스에서 조합한다."
      directories: ["src/services"]
      responsibilities:
        - "ADMIN_EMAIL 비교 판정 헬퍼"
        - "recoverable/not_recoverable/undetermined 판정 로직(DetectPartialFailures, RecoverPartialFailure 재검증에서 공유)"
        - "RecoverPartialFailure의 Subscription 갱신 + AdminActionLog 생성 오케스트레이션(원자성 보장)"
        - "매출/통계/중복 구독 집계 조합"
      cannot_access: []
    data:
      description: "AdminActionLog 영속화, 기존 Subscription/PaymentAttempt/User/HealthLog/CareLink에 대한 신규 조회·집계 쿼리(현재 이 저장소들에 목록/집계 조회 함수가 없다 — payment-attempt-repository.ts는 create만 존재)."
      directories: ["src/lib/data"]
      responsibilities:
        - "admin-action-log-repository (신규): create, findBySubscriptionId 등"
        - "subscription-repository 확장: 상태별 카운트, 전체 목록, 중복 유효 구독 탐지 쿼리 추가"
        - "payment-attempt-repository 확장: subscription_id별 최신 1건 조회, 기간별 success 합계 조회 추가"
        - "health-log/care-link repository(기존, seed-v1)에 카운트 전용 조회 추가"
      cannot_access: ["presentation"]
  layer_communication:
    presentation_to_logic: "Server Action 직접 호출(복구), 또는 서버 컴포넌트가 admin-service를 직접 호출(조회) — seed-v1~v3와 동일 패턴"
    logic_to_data: "repository 패턴 (seed-v1~v3와 동일)"
    data_format: "DTO/plain object"

