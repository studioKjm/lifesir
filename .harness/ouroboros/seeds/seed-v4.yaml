tech_decisions:
  - decision: "관리자 판정을 위한 새 엔티티(Role/Permission/is_admin 필드)를 만들지 않고, 로그인 세션의 User.email과 서버 전용 환경변수 ADMIN_EMAIL을 런타임에 비교하는 방식으로 접근을 제한한다."
    reason: "관리자가 단일 운영자 1명뿐이라는 인터뷰 결정과 결합하면, 권한 체계를 도입하는 비용이 얻는 가치보다 훨씬 크다 — 나중에 관리자가 여러 명이 되면 그때 Role 엔티티를 도입하는 게 지금 미리 만드는 것보다 낫다(GEN-004/최소 코드 원칙)."
    alternatives_considered:
      - "users 테이블에 is_admin 컬럼 추가 — 스키마 변경과 마이그레이션이 필요한데, 지금은 이메일 하나만 비교하면 충분해 과한 선택"
      - "완전히 분리된 관리자 로그인 체계 — 새 인증 플로우를 통째로 구현해야 해서 이번 스코프에 비해 과함"
  - decision: "partial_failure 방치 구독의 recoverable/not_recoverable/undetermined 판정은 새로운 영속 필드나 테이블 없이, 기존 Subscription과 PaymentAttempt 데이터를 조회 시점마다 재해석해서 계산한다."
    reason: "billing-service.ts의 BillingOutcome은 원래 휘발성 반환값으로 설계됐고(seed-v3 tech_decisions), 이를 영속화하려면 스키마 변경과 billing-service.ts 수정이 필요하다. 반면 '해당 subscription의 가장 최근 PaymentAttempt.result'만으로 A/B 대부분을 구분할 수 있다는 게 Ontologist 검증으로 확인됐다 — 극희귀 케이스(PaymentAttempt 기록 자체도 실패)만 undetermined로 명시적으로 분리하면 새 스키마 없이도 정확하고 안전한 판정이 가능하다."
    alternatives_considered:
      - "billing-service.ts를 수정해 BillingOutcome을 별도 테이블에 영속화 — 더 견고하지만 seed-v3의 완결된 코드를 다시 건드려야 하고, 이번 스코프(조회+좁은 복구)엔 과한 변경"
  - decision: "RecoverPartialFailure는 Subscription.status뿐 아니라 current_period/next_billing_at까지 함께 정상값으로 재계산한다(단순히 status만 바꾸지 않는다)."
    reason: "status만 바꾸면 next_billing_at이 null로 남아 이 구독이 이후 cron의 findDueToday 대상에서 영구 제외된다 — '복구'가 매 주기 관리자 개입이 필요한 임시방편이 되는 건 이 액션의 목적(정상 상태로 되돌리기)과 맞지 않는다는 게 인터뷰에서 확인됨."
    alternatives_considered:
      - "status만 active로 복구하고 next_billing_at은 건드리지 않음 — 더 좁은 변경이지만, 매 결제 주기마다 관리자가 다시 수작업해야 하는 반복 부담을 만들어 도구로서의 가치가 떨어짐"
  - decision: "AdminActionLog는 RecoverPartialFailure 하나의 쓰기 액션에만 남기고, 조회성 액션들은 로깅하지 않는다."
    reason: "인터뷰는 '구독 상태를 바꿀 때' 기록한다고만 답했다 — 조회 로깅까지 확대하는 건 검증되지 않은 스코프 확장이다(Ontologist가 지적). 돈이 걸린 유일한 쓰기 지점만 감사하면 이번 스코프의 목적(누가 언제 무엇을 바꿨는지 추적)에 충분하다."
    alternatives_considered:
      - "모든 관리자 조회도 로깅 — 감사 추적은 더 완전해지지만 불필요한 테이블 증가와 이번 스코프 밖의 요구사항"
