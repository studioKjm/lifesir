# Seed Specification v3
# Generated: 2026-09-15
# Source Interview: .harness/ouroboros/interviews/2026-09-15-18-21.yaml
# WARNING: This file is immutable. To change, create a new version.

version: 3
created: "2026-09-15T18:30:00"
interview_ref: ".harness/ouroboros/interviews/2026-09-15-18-21.yaml"
extends: "seed-v2.yaml"

goal:
  summary: "AI 코치(/chat) 기능을 토스페이먼츠 정기결제 기반 구독형 유료 서비스로 전환한다."
  detail: >
    건강 기록(/dashboard)과 케어링크(/care-links)는 계속 영구 무료로 제공하되, AI 코치
    대화 기능만 월 9,900원 또는 연 99,000원 구독으로 잠근다. 신규/기존 유저 모두 카드
    등록을 조건으로 한 7일 무료체험을 거치며, 체험이 끝나면 우리 서버의 일일
    스케줄러가 토스페이먼츠 빌링 API를 직접 호출해 자동으로 유료 전환한다(토스 웹훅
    수신 방식이 아니다).
  non_goals:
    - "환불/청약철회 기능 자동화"
    - "결제수단(카드) 변경 기능 — 카드를 바꾸려면 해지 후 재구독"
    - "카카오페이 등 카드 외 간편결제 지원"
    - "가족(케어링크) 단위 공유 구독"
    - "관리자용 결제/매출 조회, 구독 강제 조작 (seed-v4 어드민 대시보드 스코프)"
    - "프로모션/쿠폰/할인 코드"
    - "전자상거래법 등 정기결제 관련 정식 규제 준수 감사 (정식 서비스 전환 시점에 별도 시드로 다룸 — seed-v1의 기존 non_goal과 동일한 방침)"

constraints:
  must:
    - "AI 코치(/chat)는 유효한 구독(status=trial 또는 active, 또는 status=canceled이면서 current_period_end 이전)이 없으면 이용할 수 없다"
    - "건강 기록·케어링크는 구독 상태와 무관하게 항상 이용 가능해야 한다"
    - "무료체험(StartFreeTrial)은 User 생애주기 동안 최초 1회만 가능하다 — PaymentMethod가 이미 존재하는 User는 다시 시작할 수 없다"
    - "정기결제 자동 청구(ExecuteRecurringBilling)는 우리 서버의 일일 스케줄러가 토스페이먼츠 API를 직접 호출해 트리거한다 — 토스 웹훅 수신에 의존하지 않는다"
    - "결제 실패 시 유예기간 없이 즉시 status를 past_due로 전환하고 AI 코치 접근을 차단한다"
    - "해지(CancelSubscription) 시 이미 결제한 주기가 끝날 때까지는 접근을 유지한다 — 해지 즉시 차단하지 않는다"
    - "카드 원본 정보(카드번호 전체, CVC 등)는 우리 서버/DB에 저장하지 않는다 — 토스페이먼츠가 발급한 billing_key와 card_last4만 저장한다"
    - "정기결제 시도(ExecuteRecurringBilling)의 성공/실패는 PaymentAttempt로 감사 추적 가능하게 기록한다"
    - "기존 가입 유저(seed-v1/v2 계정)에게도 신규 유저와 동일한 규칙을 예외 없이 적용한다 — grandfather 조항 없음"
    - "결제 관련 민감정보(카드번호, CVC, 토스페이먼츠 시크릿 키 등)는 클라이언트 코드나 로그에 노출하지 않는다"
  must_not:
    - "환불/청약철회 기능을 구현하지 않는다"
    - "결제수단(카드) 변경 기능을 구현하지 않는다"
    - "카드 외 결제수단(카카오페이 등 간편결제)을 지원하지 않는다"
    - "가족(케어링크) 단위 공유 구독을 구현하지 않는다"
    - "past_due 상태에 대해 시스템이 자동 재시도(retry)하지 않는다 — 사용자가 직접 재구독(Resubscribe)해야 한다"
    - "한 User가 동시에 두 개 이상의 유효한(status IN trial/active/past_due) Subscription을 갖지 않는다"
  should:
    - "Subscription 상태 전이 로직(trial→active→past_due/canceled→expired)은 한 곳(상태 머신)에 모아 로직이 흩어지지 않게 한다"
    - "구독 상태 조회 화면은 다음 결제 예정일 또는 만료일을 명확한 날짜로 표시한다"

acceptance_criteria:
  - id: "AC-001"
    description: "PaymentMethod가 없는 User가 /chat에 진입하면 AI 코치 대화 기능(API 호출)이 차단되고, 무료체험(카드 등록) 시작 안내 화면으로 유도된다"
    verification: "both"
    priority: "must"
    complexity: "high"
  - id: "AC-002"
    description: "PaymentMethod가 없는 User가 플랜(월간/연간)을 선택하고 토스페이먼츠 카드 등록(빌링키 발급)에 성공하면, PaymentMethod가 생성되고 Subscription(status=trial, trial_end_at=+7일)이 생성되며 즉시 AI 코치를 사용할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "high"
  - id: "AC-003"
    description: "PaymentMethod가 이미 존재하는 User는 StartFreeTrial(무료체험 시작)을 다시 호출할 수 없다 — 무료체험은 평생 1회로 제한된다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-004"
    description: "일일 스케줄러가 실행되면, 오늘이 next_billing_at인 status=trial 또는 active인 모든 Subscription에 대해 등록된 billing_key로 정기결제를 실행한다. 성공하면 PaymentAttempt(success)가 기록되고 status=active로 갱신되며 다음 결제 주기(current_period, next_billing_at)가 설정된다"
    verification: "automated"
    priority: "must"
    complexity: "high"
  - id: "AC-005"
    description: "정기결제가 실패하면 PaymentAttempt(failure, failure_reason)가 기록되고 Subscription.status가 유예기간 없이 즉시 past_due로 전환되어 AI 코치 접근이 차단되며, 재결제 안내 화면이 표시된다"
    verification: "automated"
    priority: "must"
    complexity: "high"
  - id: "AC-006"
    description: "status가 trial 또는 active인 User가 해지를 요청하면 status=canceled로 바뀌고 canceled_at이 기록되지만, current_period_end까지는 AI 코치를 계속 사용할 수 있다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-007"
    description: "일일 스케줄러가 current_period_end가 지난 status=canceled Subscription을 찾아 status=expired로 전환한다. 이 시점부터 해당 User의 AI 코치 접근이 차단된다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-008"
    description: "PaymentMethod는 있지만 유효한(trial/active) Subscription이 없는 User(canceled 후 만료됐거나 past_due)가 재구독(Resubscribe)하면, 무료체험 단계 없이 등록된 billing_key로 즉시 청구되고 성공 시 바로 status=active인 새 Subscription이 시작된다"
    verification: "both"
    priority: "must"
    complexity: "high"
  - id: "AC-009"
    description: "User는 자신의 현재 구독 상태(trial/active/past_due/canceled/expired), 플랜(월간/연간), 다음 결제 예정일 또는 만료일을 화면에서 확인할 수 있고, 유효한 구독이 있으면 해지 버튼을 사용할 수 있다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-010"
    description: "건강 기록(/dashboard) 및 케어링크(/care-links) 기능은 Subscription 상태와 무관하게 항상 접근 가능하다 (회귀 방지)"
    verification: "automated"
    priority: "must"
    complexity: "low"
  - id: "AC-011"
    description: "기존(seed-v1/v2로 가입한) 유저도 신규 유저와 동일한 규칙이 적용된다 — 별도의 소급/예외 처리 로직이 코드에 존재하지 않는다"
    verification: "automated"
    priority: "must"
    complexity: "low"

ontology:
  entities:
    - name: "User"
      note: "seed-v1/v2 User의 확장. 기존 필드는 변경하지 않는다. 이번 시드에서 relationships만 추가된다."
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "email"
          type: "string"
          required: true
        - name: "name"
          type: "string"
          required: true
        - name: "birth_date"
          type: "date"
          required: false
        - name: "agent_persona_id"
          type: "reference"
          required: false
      relationships:
        - target: "PaymentMethod"
          type: "has_one"
        - target: "Subscription"
          type: "has_many"

    - name: "PaymentMethod"
      note: "User당 생애주기에서 정확히 1건만 존재한다(카드 변경/재등록 기능은 이번 스코프 비목표). 해지·만료 후에도 삭제되지 않고 재구독 시 재사용된다."
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "user_id"
          type: "reference"
          required: true
        - name: "billing_key"
          type: "string"
          required: true
        - name: "card_last4"
          type: "string"
          required: true
        - name: "registered_at"
          type: "date"
          required: true
      relationships:
        - target: "User"
          type: "belongs_to"

    - name: "Subscription"
      note: >
        User 생애주기 동안 여러 건 생성될 수 있다(해지→만료→재구독마다 새 레코드).
        상태머신: trial → active ⇄(cancel 요청) canceled → expired,
        active/trial → past_due(결제 실패, 유예 없이 즉시) → (재구독 시 새 Subscription 생성).
        trial은 User의 '첫 Subscription'에만 존재한다 — 재구독으로 생성되는 Subscription은
        trial 단계 없이 곧바로 active로 시작한다(PaymentMethod가 이미 있으므로).
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "user_id"
          type: "reference"
          required: true
        - name: "plan"
          type: "string"
          enum: ["monthly", "yearly"]
          required: true
        - name: "amount"
          type: "number"
          required: true
        - name: "status"
          type: "string"
          enum: ["trial", "active", "canceled", "past_due", "expired"]
          required: true
        - name: "trial_end_at"
          type: "date"
          required: false
        - name: "current_period_start"
          type: "date"
          required: true
        - name: "current_period_end"
          type: "date"
          required: true
        - name: "next_billing_at"
          type: "date"
          required: false
        - name: "canceled_at"
          type: "date"
          required: false
        - name: "created_at"
          type: "date"
          required: true
      relationships:
        - target: "User"
          type: "belongs_to"
        - target: "PaymentAttempt"
          type: "has_many"

    - name: "PaymentAttempt"
      note: "cron이 실행하는 정기결제 시도의 성공/실패 감사 기록. Subscribe/Resubscribe 시점의 동기적 결제 실패는 여기 기록하지 않는다(즉시 에러 반환으로 충분, 최소 코드 원칙)."
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "subscription_id"
          type: "reference"
          required: true
        - name: "attempted_at"
          type: "date"
          required: true
        - name: "result"
          type: "string"
          enum: ["success", "failure"]
          required: true
        - name: "amount"
          type: "number"
          required: true
        - name: "pg_transaction_id"
          type: "string"
          required: false
        - name: "failure_reason"
          type: "string"
          required: false
      relationships:
        - target: "Subscription"
          type: "belongs_to"

  actions:
    - name: "StartFreeTrial"
      actor: "PaymentMethod가 없는 User (평생 최초 구독 시도)"
      input: "plan(monthly|yearly), 토스페이먼츠 빌링키 발급 요청 파라미터(카드 등록 흐름의 authKey 등)"
      output: "PaymentMethod(신규) + Subscription(status=trial)"
      side_effects:
        - "토스페이먼츠 빌링키 발급 API 호출"
        - "PaymentMethod 레코드 생성 (User당 유일, 이후 재사용)"
        - "Subscription 레코드 생성: status=trial, trial_end_at=now+7일, current_period_end=trial_end_at, next_billing_at=trial_end_at"
      invariant: "PaymentMethod가 이미 존재하는 User는 이 액션을 호출할 수 없다 (Resubscribe를 사용)"

    - name: "Resubscribe"
      actor: "PaymentMethod는 있지만 현재 유효한 Subscription(trial/active)이 없는 User"
      input: "plan(monthly|yearly)"
      output: "성공 시 Subscription(신규, status=active) — 실패 시 Subscription 생성 없이 에러"
      side_effects:
        - "등록된 billing_key로 토스페이먼츠 즉시 청구 API 호출"
        - "성공: Subscription 신규 레코드 생성(trial 단계 없이 status=active), current_period/next_billing_at 설정"
        - "실패: 레코드 생성 없이 에러 반환, 사용자가 화면에서 재시도"

    - name: "ExecuteRecurringBilling"
      actor: "시스템 스케줄러(일일 cron)"
      input: "실행일자(오늘)"
      output: "오늘 next_billing_at이고 status가 trial 또는 active인 모든 Subscription에 대한 청구 결과 목록"
      side_effects:
        - "대상 Subscription마다 등록된 billing_key로 토스페이먼츠 정기결제(자동청구) API 호출"
        - "성공: PaymentAttempt(success) 기록, status=active로 갱신(trial→active 전환 포함), current_period_start/end 및 next_billing_at을 다음 주기로 갱신"
        - "실패: PaymentAttempt(failure, failure_reason) 기록, status=past_due로 즉시 전환(유예 없음), next_billing_at=null(자동 재시도 없음) → AI코치 즉시 차단"

    - name: "CancelSubscription"
      actor: "status가 trial 또는 active인 Subscription을 보유한 User"
      input: "없음 (대상은 해당 User의 현재 유효 Subscription)"
      output: "Subscription.status=canceled"
      side_effects:
        - "canceled_at=now 기록, next_billing_at=null (이후 ExecuteRecurringBilling 대상에서 제외)"
        - "current_period_end까지는 접근 유지 — 즉시 차단 아님"

    - name: "ExpireCanceledSubscriptions"
      actor: "시스템 스케줄러(일일 cron)"
      input: "실행일자(오늘)"
      output: "status=canceled이고 current_period_end < 오늘인 Subscription 전체 → status=expired"
      side_effects:
        - "해당 User의 AI 코치 접근이 이 시점부터 차단됨"

    - name: "CheckAICoachAccess"
      actor: "Logic 레이어 (사용자가 /chat 진입을 시도할 때 호출되는 게이트)"
      input: "user_id"
      output: "접근 허용 여부(boolean) + 사유(trial_active | paid_active | grace_until_period_end | blocked:reason)"
      side_effects:
        - "없음 (읽기 전용) — status가 trial/active이거나, canceled이면서 current_period_end >= now인 최신 Subscription이 있으면 허용, 그 외(past_due/expired/구독 이력 없음)는 차단 + 재구독 유도 화면으로 안내"

  invariants:
    - "User당 PaymentMethod는 최대 1건이며, StartFreeTrial은 PaymentMethod가 없는 User에게만 허용된다 (무료체험은 평생 1회)"
    - "canceled 상태의 Subscription은 current_period_end 이전까지 AI 코치 접근을 계속 허용한다 — '해지'는 즉시 차단을 의미하지 않는다"
    - "past_due 상태는 유예 없이 즉시 AI 코치 접근을 차단하며, cron은 past_due Subscription을 재시도 대상으로 삼지 않는다 (next_billing_at=null)"
    - "임의 시점에 한 User가 가진 status IN (trial, active, past_due) Subscription은 최대 1건이다 — 동시에 두 개의 '살아있는' 결제 주기를 가질 수 없다"
    - "건강 기록(HealthLog)·케어링크(CareLink)는 이 온톨로지의 어떤 상태에도 영향받지 않는다 (영구 무료 — AI 코치만 잠긴다)"

architecture:
  pattern: "3-tier-layered"
  layers:
    presentation:
      description: "구독 상태 조회/해지 화면, 무료체험 시작(카드 등록) 플로우 UI, /chat 진입 시 AI코치 접근 게이트, 일일 배치를 외부 스케줄러가 호출하는 Route Handler(얇은 어댑터, seed-v2의 OAuth 콜백과 동일 패턴)"
      directories: ["src/app", "src/components"]
      responsibilities:
        - "플랜 선택 UI, 토스페이먼츠 카드 등록(빌링키 발급) 위젯/리다이렉트 트리거"
        - "구독 상태 조회 화면, 해지 버튼"
        - "/chat 페이지 진입 시 CheckAICoachAccess 호출 후 차단 화면 또는 대화 UI 분기"
        - "cron이 호출하는 /api/billing/run-daily 같은 Route Handler — 인증(cron 전용 시크릿) 확인 후 Logic 레이어 호출만 위임"
      cannot_access: ["database", "external_services"]
    logic:
      description: "구독 상태 머신, 무료체험/재구독/해지 판정, 정기결제 배치 오케스트레이션 — seed-v1/v2의 auth-service/dashboard-service와 같은 위치에 subscription-service/billing-service로 신설"
      directories: ["src/services"]
      responsibilities:
        - "StartFreeTrial/Resubscribe/CancelSubscription/CheckAICoachAccess 비즈니스 규칙"
        - "ExecuteRecurringBilling/ExpireCanceledSubscriptions 배치 오케스트레이션(대상 조회 → PG 호출 → 상태 갱신을 트랜잭션 단위로 조율)"
        - "PaymentMethod 존재 여부에 따른 trial 1회 제한 불변식 강제"
      cannot_access: []
    data:
      description: "PaymentMethod/Subscription/PaymentAttempt 영속화, 토스페이먼츠 API 클라이언트(빌링키 발급/정기결제 요청)"
      directories: ["src/lib/data"]
      responsibilities:
        - "subscription-repository, payment-method-repository, payment-attempt-repository"
        - "토스페이먼츠 REST API 호출 래퍼(시크릿 키는 서버 전용 환경변수로만 접근)"
        - "일일 배치 대상(오늘 청구 예정 Subscription, 만료 대상 canceled Subscription) 조회 쿼리"
      cannot_access: ["presentation"]
  layer_communication:
    presentation_to_logic: "Server Action 직접 호출(카드 등록/해지/재구독), 또는 cron이 호출하는 Route Handler를 통한 배치 트리거(seed-v2 OAuth 콜백과 동일 패턴 — 얇은 어댑터)"
    logic_to_data: "repository/client wrapper 패턴 (seed-v1/v2와 동일)"
    data_format: "DTO/plain object"

scope:
  mvp:
    - "카드 등록(토스페이먼츠 빌링키 발급) → 7일 무료체험 시작, User당 평생 1회"
    - "월간(9,900원)/연간(99,000원) 플랜 선택"
    - "일일 스케줄러 기반 자동 정기결제 청구 및 실패 처리(PaymentAttempt 기록)"
    - "결제 성공/실패/해지/만료에 따른 AI 코치 접근 제어(CheckAICoachAccess)"
    - "해지(다음 결제부터 중단, 잔여 기간 접근 유지) 및 제한 없는 재구독"
    - "구독 상태(trial/active/past_due/canceled/expired) 조회 화면"
    - "기존 가입 유저에 대한 예외 없는 동일 정책 적용"
  future:
    - "환불/청약철회 자동화"
    - "결제수단(카드) 변경 기능"
    - "카카오페이 등 간편결제 추가"
    - "가족 단위 공유 구독"
    - "관리자 결제/매출 대시보드, 구독 강제 조작 (seed-v4)"
    - "프로모션/쿠폰/할인 코드"
    - "정기결제 자동 재시도(dunning) 로직"

tech_decisions:
  - decision: "정기결제 트리거는 토스페이먼츠 웹훅이 아니라 우리 서버 주도의 일일 스케줄러(외부 스케줄러가 HTTP 엔드포인트를 호출)로 구현한다."
    reason: "인터뷰에서 사용자가 '흐름을 우리가 완전히 통제'하고 싶다고 명시적으로 선택 — 웹훅 서명 검증·재전송 멱등성 처리·웹훅 유실 시 복구 로직을 이번 스코프에서 지지 않아도 된다."
    alternatives_considered:
      - "토스페이먼츠 웹훅(콜백) 수신 방식 — 결제 이벤트가 발생하는 즉시 반영되지만 부가 구현 부담이 커 이번 스코프엔 과함"
  - decision: "구독 상태(Subscription)를 User 테이블의 필드가 아니라 별도 엔티티로 분리한다."
    reason: "재구독으로 User 생애주기 동안 여러 Subscription 레코드가 생성될 수 있어 1:N 관계로만 정확히 표현되며, 인증 도메인(User)과 결제 도메인(Subscription)의 책임을 분리해 3-tier 원칙을 도메인 모델 수준에서도 지킨다."
    alternatives_considered:
      - "User 테이블에 subscription_status/next_billing_at 컬럼을 직접 추가 — 재구독 이력을 표현할 수 없고 매번 덮어써야 해서 감사 추적이 불가능해짐"
  - decision: "카드 결제수단(PaymentMethod)은 Subscription이 아니라 User에 종속시켜 1인당 1건만 유지한다."
    reason: "카드 변경 기능이 이번 스코프에서 제외됐고, 카드 등록이 곧 무료체험 시작 조건이라는 인터뷰 결정을 결합하면 '무료체험은 User 생애주기 1회'가 유일하게 성립하는 해석이다."
    alternatives_considered:
      - "Subscription마다 새 PaymentMethod를 등록 — 재구독할 때마다 카드를 다시 입력해야 해서 실사용자 경험이 나쁘고 '카드 변경 기능 제외' 결정과도 충돌"
  - decision: "정기결제 실패는 PaymentAttempt로 영구 기록하되, 사용자가 직접 시도하는 동기적 재구독(Resubscribe) 실패는 기록하지 않는다."
    reason: "cron 배치 실패는 사람이 그 순간 보지 못해 사후 감사 기록이 유일한 확인 수단이지만, 사용자 눈앞에서 즉시 실패하는 재구독 시도는 그 자리에서 재시도 가능해 영구 기록의 가치가 낮다(최소 코드 원칙)."
    alternatives_considered:
      - "모든 결제 시도를 예외 없이 PaymentAttempt로 기록 — 감사 추적은 더 완전해지지만 불필요한 관계/코드가 늘어남"
  - decision: "일일 스케줄러를 실제로 어떤 인프라(Vercel Cron 등)로 돌릴지는 이 시드에서 확정하지 않고 /trd에서 결정한다."
    reason: "인터뷰는 '웹훅이 아니라 서버 주도 폴링'이라는 방식만 결정했고, 정확한 인프라 선택은 배포 환경(Vercel)과 신규 의존성 승인 여부에 따라 달라져 기술 설계 단계에서 다루는 것이 맞다."
    alternatives_considered:
      - "이 시드에서 Vercel Cron으로 못박기 — 아직 사용자 승인을 받지 않은 인프라 결정을 인터뷰만으로 확정하는 것은 시기상조"
