version: 1
created: "2026-09-08T20:08:10"
interview_ref: ".harness/ouroboros/interviews/2026-09-08-19-42.yaml"

goal:
  summary: "부모-자녀가 함께 쓰는 건강 관리 앱의 1주일 UI/UX 프로토타입을 만들어, AI 에이전트 기반 개인화 코칭과 가족 간 건강 데이터 공유 경험을 실사용자에게 검증한다."
  detail: >
    '라이프 토탈 케어' 서비스는 궁극적으로 건강/재무/커리어/일정을 통합 관리하는
    AI 에이전트 기반 플랫폼을 지향하지만, 이번 시드는 그중 건강 도메인만을
    1주일 내 솔로 개발로 구현하는 UI/UX 프로토타입에 한정한다. 핵심 차별화
    포인트는 (1) 연령대에 맞게 다르게 응답하는 개인화 AI 에이전트, (2) 자녀가
    부모의 건강 데이터를 동의 기반으로 실시간에 가깝게 확인하는 가족 케어
    경험 두 가지다.
  non_goals:
    - "재무/커리어/일정 도메인 구현 (다음 시드에서 순차 확장)"
    - "마이데이터(은행/카드), 국민건강보험공단, 카카오/네이버 로그인 등 외부 서비스 연동"
    - "의료데이터 보호 법령에 따른 정식 규제 준수 (정식 서비스 전환 시점에 별도 시드로 다룸)"
    - "AI 에이전트의 장기 기억/개인화 학습 축적 (이번엔 최근 기록 기반 단기 컨텍스트만)"
    - "연령대별 데이터 격리(멀티테넌시) 아키텍처"

constraints:
  must:
    - "1주일 내 솔로 개발로 완성 가능한 범위로 제한한다"
    - "3-tier(Presentation/Logic/Data) 레이어 분리를 지킨다 — Next.js API routes/Server Actions가 Logic 계층이며, Presentation(클라이언트)이 데이터스토어를 직접 호출하지 않는다"
    - "이메일/비밀번호 기반 실제 인증(회원가입/로그인)을 구현한다"
    - "AI 에이전트는 실제 LLM API와 연동해 응답을 생성한다"
    - "CareLink(부모-자녀 연결)는 대상자의 명시적 동의(accept) 없이는 성립하지 않는다"
    - "전체 사용자 플로우를 E2E 자동화 테스트로 검증하고, 추가로 브라우저 수동 실검증을 병행한다"
    - "일반적인 예외 상황(신규 사용자 데이터 없음, 미연결 상태, LLM 응답 실패 등)을 happy path 외에도 사전 처리한다"
  must_not:
    - "마이데이터/건강보험공단/카카오·네이버 등 외부 서비스와 연동하지 않는다"
    - "의료데이터 규제 준수 절차(마이데이터 사업자 등록 등)를 이번 스코프에서 진행하지 않는다"
    - ".env 등 시크릿 파일을 커밋하지 않는다"
    - "CareLink가 accepted 상태가 아닌 관계에서 타인의 건강 데이터를 노출하지 않는다"
  should:
    - "Next.js + React 기반 단일 스택으로 구현한다"
    - "무료/저비용 티어로 운영 가능한 백엔드를 사용한다 — 최종 기술 선택은 /trd에서 확정"
    - "부모-자녀 동의 UX는 별도 리서치 결과를 반영해 이후 개선한다"

acceptance_criteria:
  - id: "AC-001"
    description: "방문자는 이메일/비밀번호와 이름, 생년월일로 회원가입할 수 있고, 가입한 계정으로 로그인할 수 있다 (카카오/네이버 로그인 제외)"
    verification: "both"
    priority: "must"
    complexity: "medium"
  - id: "AC-002"
    description: "회원가입 시 입력한 생년월일에 따라 5개 연령대(10s/20s/30s/40s/50s_plus) 중 하나의 AgentPersona가 자동으로 매칭되어 계정에 연결된다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-003"
    description: "로그인한 User는 다른 User의 이메일로 CareLink 연결을 요청(pending)할 수 있고, 대상 User가 이를 수락(accepted)하거나 거절(rejected)할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "medium"
  - id: "AC-004"
    description: "CareLink가 accepted 상태가 아닌 대상 User의 대시보드에 접근을 시도하면 접근이 거부된다"
    verification: "automated"
    priority: "must"
    complexity: "high"
  - id: "AC-005"
    description: "User는 운동/수면/체중/식사/복약 5개 유형의 HealthLog를 기록할 수 있으며, CareLink가 accepted인 자녀는 부모를 대신해 대리 입력할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "medium"
  - id: "AC-006"
    description: "User는 본인 대시보드에서 자신이 기록한 HealthLog를 유형별 추이로 확인할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "low"
  - id: "AC-007"
    description: "CareLink가 accepted인 자녀는 부모 User의 HealthLog 대시보드를 읽기 전용으로 조회할 수 있다"
    verification: "both"
    priority: "must"
    complexity: "medium"
  - id: "AC-008"
    description: "User는 AI 에이전트와 대화창에서 대화할 수 있으며, 에이전트는 실제 LLM API를 호출해 응답을 생성하고 해당 User의 최근 HealthLog 일부를 프롬프트 컨텍스트로 포함한다 (영구 저장/장기 학습 없음)"
    verification: "both"
    priority: "must"
    complexity: "high"
  - id: "AC-009"
    description: "AI 에이전트는 User에 매칭된 AgentPersona의 tone/system_prompt를 반영해 연령대에 맞는 어투로 응답한다"
    verification: "manual"
    priority: "should"
    complexity: "medium"
  - id: "AC-010"
    description: "HealthLog가 없는 신규 사용자, CareLink 미연결 상태, LLM 응답 실패 상황에서 앱이 오류로 중단되지 않고 적절한 안내 화면/메시지를 표시한다"
    verification: "automated"
    priority: "must"
    complexity: "medium"
  - id: "AC-011"
    description: "회원가입 → 로그인 → CareLink 요청/수락 → HealthLog 기록 → 대시보드 확인 → AI 에이전트 대화로 이어지는 전체 플로우가 E2E 자동화 테스트로 통과한다"
    verification: "automated"
    priority: "must"
    complexity: "medium"

ontology:
  entities:
    - name: "User"
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "email"
          type: "string"
          required: true
        - name: "password_hash"
          type: "string"
          required: true
        - name: "name"
          type: "string"
          required: true
        - name: "birth_date"
          type: "date"
          required: true
        - name: "created_at"
          type: "date"
          required: true
      relationships:
        - target: "HealthLog"
          type: "has_many"
        - target: "CareLink"
          type: "has_many"
        - target: "Conversation"
          type: "has_many"
        - target: "AgentPersona"
          type: "belongs_to"
    - name: "CareLink"
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "requester_user_id"
          type: "reference"
          required: true
        - name: "target_user_id"
          type: "reference"
          required: true
        - name: "status"
          type: "string"
          required: true
        - name: "consent_confirmed_at"
          type: "date"
          required: false
        - name: "created_at"
          type: "date"
          required: true
      relationships:
        - target: "User"
          type: "belongs_to"
    - name: "HealthLog"
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "user_id"
          type: "reference"
          required: true
        - name: "logged_by_user_id"
          type: "reference"
          required: true
        - name: "log_type"
          type: "string"
          required: true
        - name: "value"
          type: "string"
          required: true
        - name: "unit"
          type: "string"
          required: false
        - name: "logged_at"
          type: "date"
          required: true
        - name: "note"
          type: "string"
          required: false
        - name: "created_at"
          type: "date"
          required: true
      relationships:
        - target: "User"
          type: "belongs_to"
    - name: "Conversation"
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "user_id"
          type: "reference"
          required: true
        - name: "agent_persona_id"
          type: "reference"
          required: true
        - name: "started_at"
          type: "date"
          required: true
      relationships:
        - target: "User"
          type: "belongs_to"
        - target: "AgentPersona"
          type: "belongs_to"
        - target: "Message"
          type: "has_many"
    - name: "Message"
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "conversation_id"
          type: "reference"
          required: true
        - name: "role"
          type: "string"
          required: true
        - name: "content"
          type: "string"
          required: true
        - name: "created_at"
          type: "date"
          required: true
      relationships:
        - target: "Conversation"
          type: "belongs_to"
    - name: "AgentPersona"
      fields:
        - name: "id"
          type: "reference"
          required: true
        - name: "age_band"
          type: "string"
          required: true
        - name: "tone"
          type: "string"
          required: true
        - name: "system_prompt"
          type: "string"
          required: true
      relationships:
        - target: "Conversation"
          type: "has_many"
        - target: "User"
          type: "has_many"
  actions:
    - name: "SignUp"
      actor: "방문자(비회원)"
      input: "email, password, name, birth_date"
      output: "User 생성"
      side_effects:
        - "세션/토큰 발급"
        - "birth_date 기반 AgentPersona 자동 매칭"
    - name: "Login"
      actor: "User"
      input: "email, password"
      output: "세션 토큰"
      side_effects: []
    - name: "RequestCareLink"
      actor: "User"
      input: "target_user_email"
      output: "CareLink(status=pending) 생성"
      side_effects:
        - "대상 User에게 동의 요청 화면 노출"
    - name: "RespondCareLink"
      actor: "User (대상자)"
      input: "care_link_id, decision(accept|reject)"
      output: "CareLink.status 갱신"
      side_effects:
        - "accepted 시 요청자에게 대상자 대시보드 열람 권한 부여"
    - name: "RecordHealthLog"
      actor: "User (본인 또는 CareLink accepted 상태의 자녀)"
      input: "user_id, log_type, value, logged_at"
      output: "HealthLog 생성"
      side_effects:
        - "본인/보호자 대시보드 집계 갱신"
    - name: "ViewOwnDashboard"
      actor: "User"
      input: "user_id"
      output: "본인 HealthLog 집계 뷰"
      side_effects: []
    - name: "ViewParentDashboard"
      actor: "User (자녀, CareLink accepted 필요)"
      input: "care_link_id"
      output: "대상 User(부모)의 HealthLog 집계 뷰 (읽기 전용)"
      side_effects:
        - "CareLink 미승인 시 접근 거부"
    - name: "SendMessageToAgent"
      actor: "User"
      input: "conversation_id, message_text"
      output: "LLM이 생성한 Message(role=assistant)"
      side_effects:
        - "최근 HealthLog 일부를 단기 컨텍스트로 프롬프트에 포함 (영구 저장 없음)"

invariants:
  - "CareLink는 요청(pending) 후 대상자의 명시적 동의(accepted)가 있어야만 열람 권한이 성립한다"
  - "ViewParentDashboard는 CareLink.status=accepted인 관계에 대해서만 허용된다"
  - "HealthLog는 반드시 하나의 User(user_id)에 belongs_to 하며 소유자 없는 기록은 존재할 수 없다"
  - "Conversation의 컨텍스트는 최근 HealthLog 등 단기 정보로 한정되며 장기 학습/영구 프로필 축적은 이번 스코프에 포함하지 않는다"
  - "AgentPersona는 age_band에 따라 응답 방식을 다르게 하지만, User 간 데이터는 별도로 격리된 저장소(멀티테넌시)를 구성하지 않는다"
  - "로그인은 이메일/비밀번호 기반 실제 인증만 지원하며 카카오/네이버 등 소셜 로그인은 스코프 밖이다"
  - "본 프로토타입은 마이데이터/건강보험공단 등 외부 연동 및 의료데이터 규제 준수를 다루지 않는다"
  - "Presentation 계층은 Data 계층을 직접 호출하지 않고 반드시 Logic 계층(API routes/Server Actions)을 경유한다"

architecture:
  pattern: "3-tier-layered"
  layers:
    presentation:
      description: "Next.js App Router 페이지, 레이아웃, 클라이언트 컴포넌트 — HTTP 요청/응답 처리와 UI 렌더링만 담당"
      directories: ["src/app", "src/components"]
      responsibilities:
        - "HTTP request/response handling"
        - "Input validation and parsing"
        - "UI rendering"
      cannot_access: ["database", "external_services"]
    logic:
      description: "Next.js Route Handlers/Server Actions — CareLink 상태 전이, AgentPersona 매칭, LLM 프롬프트 조립 등 비즈니스 규칙"
      directories: ["src/app/api", "src/services"]
      responsibilities:
        - "Business rules and validation"
        - "Transaction orchestration"
        - "Domain logic"
      cannot_access: []
    data:
      description: "데이터 접근 레이어 — DB 클라이언트 래퍼(repository), LLM API 클라이언트"
      directories: ["src/lib/data", "src/lib/llm"]
      responsibilities:
        - "Database operations"
        - "External API calls"
        - "Data serialization"
      cannot_access: ["presentation"]
  layer_communication:
    presentation_to_logic: "Server Actions 직접 호출 또는 Route Handlers로의 fetch"
    logic_to_data: "repository/client wrapper 패턴 (Presentation에 DB 클라이언트를 직접 노출하지 않음)"
    data_format: "DTO/plain object"

scope:
  mvp:
    - "이메일/비밀번호 회원가입·로그인"
    - "생년월일 기반 AgentPersona 자동 매칭"
    - "CareLink 요청/수락/거절"
    - "HealthLog 기록 (운동/수면/체중/식사/복약)"
    - "본인 대시보드"
    - "부모 대시보드 (자녀, CareLink accepted 시)"
    - "AI 에이전트 대화 (실제 LLM 연동, 단기 컨텍스트)"
    - "일반 예외 케이스 처리 (신규 사용자, 미연결, LLM 실패)"
    - "E2E 자동화 테스트 + 수동 브라우저 검증"
  future:
    - "재무/커리어/일정 도메인"
    - "마이데이터(은행/카드) 연동"
    - "국민건강보험공단 연동"
    - "카카오/네이버 소셜 로그인"
    - "의료데이터 규제 준수 (정식 서비스 전환 시)"
    - "AI 에이전트 장기 개인화 학습"
    - "부모-자녀 동의 UX 고도화 (법적 검토 반영)"

tech_decisions:
  - decision: "프론트엔드/백엔드를 Next.js(React) 단일 스택으로 진행한다"
    reason: "사용자가 명시적으로 선호를 밝혔고, 솔로 개발자가 1주일 내 감당 가능하도록 스택을 통일할 필요가 있다"
    alternatives_considered:
      - "별도 백엔드(FastAPI/NestJS) 분리 구조"
  - decision: "3-tier 레이어 분리를 프로토타입 단계부터 유지한다"
    reason: "ARCHITECTURE_INVARIANTS.md가 모든 단계에서 이를 강제하며, 사용자도 이번 프로토타입에서 지키기로 명시적으로 확인했다"
    alternatives_considered:
      - "프로토타입 속도를 위해 클라이언트에서 DB 직접 호출 허용 (기각 — 게이트 위반 및 사용자 거부)"
  - decision: "'연령대별 테넌트'를 데이터 격리가 아닌 AgentPersona(연령대별 설정값)로 구현한다"
    reason: "완전 분리형 멀티테넌시는 1주일 스코프의 시간/복잡도 예산을 초과하며, 사용자도 '완전 분리 아님'이라고 명시했다"
    alternatives_considered:
      - "연령대별 스키마/DB 분리"
      - "연령대별 별도 앱 인스턴스"
  - decision: "백엔드/DB 최종 기술 선택(Supabase 등 후보)은 /trd 단계로 이관한다"
