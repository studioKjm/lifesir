# Code Convention
# AI 에이전트가 코드를 생성할 때 따라야 하는 규칙입니다.
# stacks 필드로 적용 대상을 필터링합니다.
#
# stacks 값: all, typescript, python, nextjs, nestjs, django, fastapi, prisma, alembic, monorepo
#
# Conventions compiled from common patterns across the Korean engineering community.
# Independently authored for this template.

# ─── 3-Tier Layer Separation Rules ──────────────────────────────────
three_tier:
  - id: LAYER-001
    rule: >
      Presentation 레이어(컴포넌트, 페이지, 컨트롤러, 라우트)에 비즈니스 로직을 넣지 않는다.
      요청 파싱, 응답 포맷팅, UI 렌더링만 담당한다.
    stacks: [all]
  - id: LAYER-002
    rule: >
      Logic 레이어(서비스, 도메인)는 Presentation 프레임워크(React, Vue, Angular, Flask templates)를
      import하지 않는다. 프레임워크 독립적으로 유지한다.
    stacks: [all]
  - id: LAYER-003
    rule: >
      Data 레이어(레포지토리, ORM, DB 드라이버)에 비즈니스 로직이나 Presentation 코드를 넣지 않는다.
      데이터 접근과 외부 연동만 담당한다.
    stacks: [all]
  - id: LAYER-004
    rule: >
      레이어 간 데이터 전달은 DTO/Interface를 통해서만 한다.
      내부 도메인 모델이나 ORM Entity를 레이어 경계 너머로 직접 전달하지 않는다.
    stacks: [all]
  - id: LAYER-005
    rule: >
      레이어를 건너뛰지 않는다. Presentation → Logic → Data 순서로만 호출한다.
      Presentation에서 Data를 직접 호출하거나, Data에서 Logic을 역참조하는 것을 금지한다.
    stacks: [all]
  - id: LAYER-006
    rule: >
      구현과 테스트를 함께 작성한다. Logic 레이어는 순수 비즈니스 로직에 집중하여 테스트하고,
      mock은 레이어 경계에서만 사용한다. 접착제 코드를 mock으로 테스트하지 않는다.
    stacks: [all]

general:
  - id: GEN-001
    rule: 함수는 하나의 책임만 수행한다. 길이가 50줄을 초과하면 쪼개는 것을 고려한다.
    stacks: [all]
  - id: GEN-002
    rule: 코드에 숫자 리터럴을 직접 박지 않는다. 명명된 상수로 뽑아낸다.
    stacks: [all]
  - id: GEN-003
    rule: 예외는 실제로 처리 가능한 지점에서 붙잡는다. 모든 에러를 상위로 던지기만 하는 코드는 금지한다.
    stacks: [all]
  - id: GEN-004
    rule: 새 라이브러리를 도입하기 전에 기존 의존성으로 해결 가능한지 먼저 확인한다.
    stacks: [all]
  - id: GEN-005
    rule: 환경 변수는 하드코딩하지 않는다. 반드시 설정 파일이나 환경 변수로 관리한다.
    stacks: [all]
  - id: GEN-006
    rule: 주석은 "왜(why)"를 설명한다. "무엇(what)"은 코드 자체가 설명해야 한다.
    stacks: [all]
  - id: GEN-007
    rule: >
      AC/스펙이 "~할 수 있다"고 명시한 능력은, 그 능력을 실제로 호출하는 Logic/Data 코드가
      있다는 것만으로 충족된 게 아니다 — 사용자가 실제로 그 경로에 도달할 수 있는 Presentation
      진입점이 최소 하나는 있어야 한다. 컴포넌트가 optional prop으로 어떤 기능을 "지원"하도록
      설계해놓고 그 prop을 채워 렌더링하는 페이지가 하나도 없다면, 구현이 아니라 미완성이다
      (2026-09-11 lifesir AC-005: 대리입력이 서비스단엔 있었지만 어떤 페이지도 호출하지 않음).
      TRD를 작성/구현할 때 seed의 각 AC 문장을 "이 능력을 실제로 클릭해서 쓸 수 있는 페이지가
      어디인가?"로 한 번씩 되짚는다.
    stacks: [all]
  - id: GEN-008
    rule: >
      로컬 개발 DB/인증 서버(Supabase 로컬 스택 등)에 의존하는 E2E 스위트가 커지면,
      병렬 워커 수를 러너 기본값(CPU 코어 수)에 맡기지 않는다. 단일 로컬 컨테이너는
      여러 워커의 동시 요청(특히 signup/signin 같은 인증 요청)을 감당 못 해 코드는
      멀쩡한데 "가끔 실패"하는 플레이키 테스트를 만든다 — 단독 파일 실행은 통과하고
      전체 스위트에서만 실패한다면 이 패턴을 의심한다(2026-09-14 lifesir: workers를
      기본값 4에서 명시적 2로 낮추고서야 안정화, ADR-002 참고). 원인 파악 없이
      retry 횟수만 늘려 증상을 덮지 않는다.
    stacks: [all]

typescript:
  - id: TS-001
    rule: any는 쓰지 않는다. 타입을 좁힐 수 없을 땐 unknown과 타입 가드 조합으로 다룬다.
    stacks: [typescript]
  - id: TS-002
    rule: 인터페이스 이름 앞에 I를 붙이지 않는다 (IUser가 아니라 User로).
    stacks: [typescript]
  - id: TS-003
    rule: enum 대신 const 객체에 as const를 붙여 유니온 타입으로 쓴다.
    stacks: [typescript]
  - id: TS-004
    rule: index.ts를 통한 re-export는 패키지의 공개 경계에만 둔다. 같은 패키지 내부에서는 파일을 직접 import한다.
    stacks: [typescript]
  - id: TS-005
    rule: 깊은 상대 경로(../../..) 대신 path alias(@/lib, @/components)를 사용한다.
    stacks: [typescript]

python:
  - id: PY-001
    rule: 타입 힌트를 모든 함수의 매개변수와 반환값에 적용한다.
    stacks: [python]
  - id: PY-002
    rule: f-string을 사용한다. format()이나 % 포매팅을 사용하지 않는다.
    stacks: [python]
  - id: PY-003
    rule: 모듈 수준의 전역 변수를 최소화한다. 설정값은 config 모듈에서 관리한다.
    stacks: [python]
  - id: PY-004
    rule: async 함수와 sync 함수를 혼용하지 않는다. 하나의 모듈은 하나의 실행 모델을 따른다.
    stacks: [python]

nextjs:
  - id: NEXT-001
    rule: 기본값은 서버 컴포넌트다. "use client"는 상호작용이 실제로 필요한 최말단 컴포넌트에만 붙인다.
    stacks: [nextjs]
  - id: NEXT-002
    rule: 데이터 조회/변경은 서버 컴포넌트나 Server Action에서 실행한다. 브라우저에서 직접 fetch를 띄우지 않는다.
    stacks: [nextjs]
  - id: NEXT-003
    rule: page.tsx에는 조립만 둔다. 실제 로직은 커스텀 훅이나 서비스 함수로 빼낸다.
    stacks: [nextjs]
  - id: NEXT-004
    rule: 이미지는 next/image를 사용한다. img 태그를 직접 사용하지 않는다.
    stacks: [nextjs]
  - id: NEXT-005
    rule: >
      서버 전용 SDK 클라이언트(Supabase 등)를 모듈 스코프 싱글턴으로 캐싱해 재사용할 때,
      그 인스턴스에서 세션을 바꾸는 메서드(signInWithPassword, signUp, auth.getUser(token),
      setSession 등)를 직접 호출하지 않는다 — 그 순간부터 같은 프로세스가 처리하는 다른
      모든 요청이 방금 그 세션의 권한으로 실행되어버리는 전역 세션 유출이 생긴다
      (2026-09-11 lifesir 프로젝트 실제 E2E에서 발견: 로그인 1회 후 서비스 role 권한이
      조용히 사라짐). 세션을 바꾸는 호출은 반드시 캐시하지 않는 전용 클라이언트에서만
      한다. 데이터 조회/변경용 싱글턴과 인증용 일회성 클라이언트를 분리한다.
    stacks: [nextjs]
  - id: NEXT-006
    rule: >
      외부 인증/결제 등 "호출 자체가 성공하는 즉시 부수효과(세션 쿠키 발급, 계정
      생성 등)를 일으키는" API(OAuth 코드 교환, signInWithPassword 등)를 쓸 때,
      그 뒤에 오는 검증/거부 로직이 이 부수효과까지 되돌리는지 반드시 확인한다.
      "이 요청은 거부되어야 한다"는 판정 자체가 맞아도, 판정 이전에 이미 발급된
      세션/쿠키/계정을 명시적으로 무효화(signOut, 계정 삭제 등)하지 않으면 거부가
      화면에서만 보이고 실제로는 거부되지 않은 상태가 남는다(2026-09-13 lifesir
      seed-v2 AC-003: exchangeCodeForSession 성공 시 쿠키가 먼저 심기고, 그 뒤에
      계정 연결 거부를 판정 — Navigator 리뷰로 "판정만 하고 세션은 안 지움" 버그
      사전 발견). NEXT-005의 "캐싱된 클라이언트에서 세션 메서드 금지"와 짝을
      이루는 규칙 — 이쪽은 "부수효과 발생 시점"과 "거부 판정 시점"의 순서 문제다.
    stacks: [nextjs]

nestjs:
  - id: NEST-001
    rule: Controller의 책임은 HTTP ↔ 내부 타입 변환뿐이다. 도메인 로직은 Service 계층으로 옮긴다.
    stacks: [nestjs]
  - id: NEST-002
    rule: DTO 필드에는 class-validator 제약을 선언한다. 검증 데코레이터가 없는 DTO는 받지 않는다.
    stacks: [nestjs]
  - id: NEST-003
    rule: 외부 서비스·리포지토리는 모듈 providers에 등록해 생성자 주입으로만 받는다. new 키워드로 직접 인스턴스화하지 않는다.
    stacks: [nestjs]
  - id: NEST-004
    rule: API 응답은 통일된 형식을 따른다. { data, error, meta } 구조를 사용한다.
    stacks: [nestjs]

fastapi:
  - id: FA-001
    rule: 라우트 함수는 요청 파싱과 응답 반환만 담당한다. 비즈니스 로직은 서비스 모듈에 둔다.
    stacks: [fastapi]
  - id: FA-002
    rule: 모든 요청/응답에 Pydantic 모델을 사용한다.
    stacks: [fastapi]
  - id: FA-003
    rule: DB 세션은 Depends()를 통해 주입받는다. 라우트에서 직접 생성하지 않는다.
    stacks: [fastapi]
  - id: FA-004
    rule: 라우트 핸들러는 async def를 기본으로 한다.
    stacks: [fastapi]

django:
  - id: DJ-001
    rule: 비즈니스 로직은 Model/Manager에 둔다. View는 얇게 유지한다.
    stacks: [django]
  - id: DJ-002
    rule: Raw SQL 대신 Django ORM을 사용한다. 불가피한 경우만 예외.
    stacks: [django]
  - id: DJ-003
    rule: 기존 마이그레이션 파일을 수정하지 않는다. 새 마이그레이션을 생성한다.
    stacks: [django]

monorepo:
  - id: MONO-001
    rule: 모노레포 내 다른 패키지를 참조할 땐 workspace:* 프로토콜로 지정한다.
    stacks: [monorepo]
  - id: MONO-002
    rule: 여러 앱이 공유하는 타입은 packages/types, 유틸 함수는 packages/utils 패키지로 모은다.
    stacks: [monorepo]
  - id: MONO-003
    rule: turbo.json의 pipeline·cache 설정 수정은 팀 리뷰 PR을 거쳐 반영한다.
    stacks: [monorepo]
