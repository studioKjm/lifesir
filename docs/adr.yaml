# Architecture Decision Records (ADR)
#
# 새 항목 추가 시 아래 스키마를 따릅니다:
#
# - id: ADR-XXX
#   title: 결정 제목
#   status: adopted | deprecated | superseded
#   date: YYYY-MM-DD
#   stacks: [적용 스택 목록]
#   context: |
#     (구체적인 상황 서술 — 이것만 읽고도 "왜 이 결정이 필요했는가"를 이해할 수 있어야 함)
#     나쁜 예: "에러 처리가 비일관적이라 통일함"
#     좋은 예: "각 서비스에서 에러를 자체적으로 catch하고 임의 형식으로 반환하고 있었다.
#              엔드포인트 A는 { message: "..." }를, B는 { error: "...", code: 500 }을 반환했다.
#              프론트엔드에서 공통 에러 핸들링이 불가능했고, 토스트 메시지 출력조차 불가능했다."
#   decision: 채택한 결정
#   consequence: 이 결정의 결과와 후속 영향

- id: ADR-001
  title: "구글 계정 자동 연결(동일 이메일)은 직접 구현하지 않고 Supabase Auth(GoTrue)에 위임한다"
  status: adopted
  date: 2026-09-13
  stacks: [nextjs]
  context: |
    seed-v2 AC-003은 "동일 이메일의 기존 계정이 있으면 구글 이메일이 verified인
    경우에만 자동 연결되고, 아니면 거부된다"를 요구했다. 처음엔 "이메일로 기존
    계정을 조회해서 우리가 직접 연결 처리를 한다"는 구현을 가정했는데, 리서치
    (context7 + Supabase 공식 문서, docs/google-oauth-setup.md 작성 과정에서 확인)
    결과 Supabase Auth가 exchangeCodeForSession() 호출 안에서 이 자동연결을
    이미 자체적으로 수행한다는 걸 알게 됐다 — 우리가 "연결하라"는 API를 따로
    부르지 않는다. 문제는 GoTrue가 연결에 실패해도 에러를 던지지 않고 조용히
    별개의 auth.users 행을 만들어버린다는 점(공식 문서에 이 실패 케이스의 에러
    형태가 문서화돼 있지 않음)이었다.

    이후 독립 Test Designer(구현 코드를 안 보고 seed spec만으로 테스트를 설계)가
    정반대 가정(구글이 반환하는 email_confirmed_at 필드를 우리 코드가 직접
    검사해서 거부 여부를 판정한다)으로 테스트를 설계해왔다 — AC 문구가 결과만
    명시하고 "누가 그 판정을 하는가"는 명시하지 않아서 생긴 해석 차이였다.
  decision: |
    자동 연결 판정 자체는 GoTrue에 완전히 위임한다. 우리 코드는 (1) 이미
    public.users에 있는 id면 그대로 로그인 처리, (2) 없는데 이메일이 이미 다른
    id로 쓰이고 있으면(=GoTrue가 연결에 실패해 별도 계정을 만든 것으로 추정)
    명시적으로 거부, (3) 그마저도 놓친 경우를 대비해 public.users.email UNIQUE
    제약 위반(DuplicateEmailError)을 최종 안전망으로 둔다. 거부 시엔 방금
    생성된 auth.users를 admin으로 삭제하고, 이미 심긴 세션 쿠키도 signOut()으로
    명시적으로 무효화한다(exchangeCodeForSession이 성공하는 즉시 쿠키부터
    심기 때문 — Navigator 리뷰로 발견).
  consequence: |
    장점: "verified 여부 판정" 로직을 우리가 재구현할 필요가 없어 버그 표면적이
    작다. 단점: 이 위임이 실제로 의도대로 동작하는지는 문서 근거로만 확인했고,
    실제 미인증(unverified) 구글 테스트 계정으로 거부되는 것을 실물로 확인하지
    못했다(.harness/ouroboros/tasks/seed-v2-decomposition.yaml의
    manual_verification_checklist 참고 — Google Cloud Console 자격증명
    발급 후 필수로 확인해야 함). 향후 seed를 쓸 때 이런 "외부 라이브러리가
    내장 기능으로 처리하는 로직"에 의존하기로 한 경우, seed의 tech_decisions나
    constraints에 그 사실을 명시해두면 Test Designer 같은 독립 검증 주체가
    같은 전제로 설계할 수 있다.

- id: ADR-002
  title: "로컬 Supabase(Docker) 기반 E2E 스위트는 Playwright 워커 수를 낮게 고정한다"
  status: adopted
  date: 2026-09-14
  stacks: [nextjs]
  context: |
    seed-v2로 E2E 스펙 파일이 5개(17개 테스트)로 늘어난 뒤, `npm run test:e2e`
    전체 실행이 간헐적으로 실패했다(회원가입 후 /signup에 그대로 머묾, 로그아웃
    후 뒤로가기 등). 단독 파일 실행은 항상 통과했고, `--workers=1`로 전체를
    돌리면 100% 통과, 기본 워커 수(이 머신 CPU 코어 수인 4)에서만 재현 가능하게
    실패했다 — 코드 버그가 아니라 로컬 Supabase Docker 스택(단일 Postgres/GoTrue
    컨테이너)이 여러 워커의 동시 signup/signin 폭주를 못 견기는 리소스 경합으로
    확인됐다(/evaluate 중 발견).
  decision: |
    playwright.config.ts에 workers: 2를 명시 고정한다(코드 근거 주석 포함).
    supabase/config.toml의 auth.rate_limit.sign_in_sign_ups도 기본 30에서
    300으로 올린다(로컬 전용 설정, 운영 배포엔 적용 안 됨).
  consequence: |
    워커 2개는 이 프로젝트 규모에서 직렬(workers:1)보다 빠르면서도 로컬 스택이
    감당 가능한 수준으로 실측 확인됨(연속 2회 17/17 안정). E2E 스위트가 더
    커지면 이 값을 재검토해야 하고, 그땐 로컬 Supabase 리소스 할당(Docker
    Desktop/OrbStack CPU·메모리) 상향도 함께 고려해야 한다.

- id: ADR-003
  title: "정기결제 이중 청구 방어를 앱 레벨 락 + 토스페이먼츠 Idempotency-Key 이중 구조로 둔다"
  status: adopted
  date: 2026-09-16
  stacks: [nextjs]
  context: |
    seed-v3(/run) 동안 이미 같은 계열의 이중 청구 버그를 세 번 잡았다 — 재구독
    더블클릭(AC-008 RETRY), cron 겹침(Test Designer 리뷰로 사후 발견). 둘 다
    "조건부 UPDATE(WHERE 현재값=기대값)를 락처럼 쓴다"는 같은 패턴
    (claimBillingSlot/markPastDueAsExpired)으로 막았다.

    /evaluate PASS 이후 /evolve의 Contrarian 리뷰에서, 이 패턴이 "선점할 살아있는
    레코드가 있는 경로"에만 적용 가능하고, canceled/expired 기원 재구독(살아있는
    레코드가 없어 선점할 자리 자체가 없는 경로)은 Presentation의 버튼
    pending-disable에만 의존한다는 사실이 다시 지적됐다 — 멀티탭/새로고침 후
    재요청처럼 클라이언트 단서로는 못 막는 현실적인 경로가 남아있었다(known
    limitation으로 코드에 이미 문서화돼 있었으나 미해결 상태).

    같은 회차 Researcher 리뷰가 토스페이먼츠 공식 문서에서 `POST
    /v1/billing/{billingKey}`가 `Idempotency-Key` 헤더(15일 유효, 최대 300자)를
    지원한다는 사실을 확인했다 — 그런데 이 프로젝트의 chargeBilling 호출부
    어디에도 이 헤더가 쓰이지 않고 있었다.
  decision: |
    두 방어를 보완 관계로 둔다: (1) DB 락(조건부 UPDATE)이 걸 자리가 있는
    경로(cron, past_due 기원 재구독)는 계속 그것을 1차 방어로 쓴다. (2) 모든
    chargeBilling 호출(cron과 재구독 양쪽)에 결정론적 Idempotency-Key를 추가한다
    — cron은 `billing:{subscriptionId}:{선점된 next_billing_at}`, 재구독은
    `resubscribe:{userId}:{오늘 날짜(UTC)}`. DB 락이 없는 경로(canceled/expired
    기원 재구독)에서는 이게 사실상 유일한 서버 측 방어가 된다 — 같은 유저가 같은
    날 두 번 요청해도 토스 서버가 두 번째 요청을 이미 처리한 요청으로 인식해
    실제 카드 청구는 한 번만 일어난다.
  consequence: |
    장점: DB 레벨 락을 걸 수 없는 경로에도 실제 이중 청구를 막는 방어선이
    생겼고, DB 락이 있는 경로도 앱 레벨 로직이 예상 못 한 레이스에 대한
    defense-in-depth를 얻었다. 단점/잔여 리스크: 이 방어는 "하루에 한 번만
    재구독 가능"이라는 부수 효과를 갖는다(재구독 idempotencyKey가 userId+날짜
    단위라서) — seed는 "재구독은 언제든 가능"이라 정했지만 "하루에 여러 번"까지
    요구하진 않아 실사용 시나리오와 충돌하지 않는다고 판단했다. 또한 이건 여전히
    "PG가 막아주는 마지막 방어선"이라 우리 쪽 DB에 두 Subscription 레코드가
    동시에 INSERT되는 것 자체를 막지는 못한다(카드 청구는 한 번만 되지만, 앱
    로직에서 여전히 중복 레코드가 생길 여지는 남는다) — 이 잔여 갭을 완전히
    닫으려면 `subscriptions(user_id)`에 partial unique index를 추가하는 방안을
    Contrarian이 제안했으나, 이번 evolve 사이클에서는 스키마 마이그레이션
    범위까지 확장하지 않고 결제 자체의 중복만 우선 차단했다 — 다음 사이클에서
    재검토 대상으로 남긴다.

- id: ADR-004
  title: "Server Action의 '비관리자/비로그인 세션 직접 호출 차단'은 e2e 자동화 대신 코드 리뷰로 검증한다"
  status: adopted
  date: 2026-09-19
  stacks: [nextjs]
  context: |
    seed-v4 AC-006(구독 복구) 구현 중 decomposition(T-028)이 "비관리자 세션으로
    Server Action을 페이지 우회해 직접 호출해도 거부되는지"를 e2e로 검증하라고
    요구했다. seed-v3의 Route Handler(`/api/chat`)는 고정된 공개 URL이라
    `fetch()`로 직접 호출하는 e2e(`tests/e2e/subscription-gate.spec.ts`)가
    가능했지만, Next.js Server Action(`"use server"` 함수)은 빌드 시점에
    해시된 action reference로만 호출 가능해 REST 엔드포인트처럼 URL을 알고
    직접 두드리는 방식이 성립하지 않는다. 세션을 바꿔가며 이미 렌더된 폼을
    재사용하는 우회 기법도 검토했으나(예: 관리자 세션으로 페이지를 띄운 뒤
    쿠키만 비관리자로 바꿔 같은 폼을 제출), 브라우저 탐색/캐시 동작에 의존해
    깨지기 쉽고(flaky) 이 코드베이스에 선례도 없었다.

    범위를 넓혀 확인한 결과, seed-v3의 기존 Server Action(`cancelSubscriptionAction`,
    `resubscribeAction`)도 처음부터 이 종류의 e2e 검증이 없었다는 게 드러났다
    — 즉 AC-006에서 새로 생긴 결함이 아니라, 이 코드베이스의 모든 Server
    Action에 처음부터 있던 미문서화 갭이었다.
  decision: |
    Server Action의 권한 검사(`isAdminEmail`/세션 검증)는 페이지 게이트와
    동일한 2줄짜리 패턴(`getSession()` → 판정 함수 → 미통과 시 redirect)을
    반복 적용하는 것으로 코드 레벨 방어를 유지하고, "비관리자가 이 액션을
    직접 호출해도 막히는가"의 최종 검증은 e2e 자동화가 아니라 (1) 코드
    리뷰(판정 함수 호출이 실제로 있는지 확인) + (2) `manual_verification_checklist`
    항목(배포 후 실환경에서 수동 확인)으로 대체한다. 대신 "id 값을 조작해
    권한 있는 세션으로 다른 대상을 공격하는" 시나리오(같은 세션, 다른
    리소스 id)는 폼 데이터 조작으로 충분히 e2e 재현 가능하므로(예:
    `tests/e2e/admin-recover.spec.ts`의 hidden input 조작 테스트) 그 경로는
    계속 자동화 테스트로 커버한다 — "누가 호출했는가"와 "무엇을 호출했는가"
    중 후자만 e2e로, 전자는 코드 리뷰로 검증을 분리한 것이다.
  consequence: |
    장점: 존재하지 않는 e2e 기법을 억지로 만들어 넣는 대신, 실제로 안정적으로
    자동화 가능한 부분(대상 id 조작)과 그렇지 않은 부분(세션 자체 위조)을
    솔직하게 구분했다. 단점: "비관리자가 Server Action을 직접 호출해도
    막히는가"라는 질문은 이 프로젝트의 모든 Server Action(`seed-v3`
    `cancelSubscriptionAction`/`resubscribeAction`, `seed-v4`
    `recoverStuckSubscriptionAction`)에 대해 여전히 자동화된 안전망 없이
    코드 리뷰 품질에 의존한다 — 새 Server Action을 추가할 때마다 이 패턴
    (판정 함수 재확인)을 빠뜨리지 않는 게 중요하며, 이후 사이클에서 테스트
    전용 헬퍼(예: 특정 세션으로 action reference를 추출해 재사용하는 유틸)를
    만들어 이 갭을 자동화로 좁힐 가치가 있는지는 재검토 대상으로 남긴다.
